<%#
  Per-calculator fixture aggregator (issue #286).

  The calculator registry (the `calculators` table) is normally populated by
  Registry::Ingest from docs/INVENTORY.md (via seeds). db:test:prepare runs
  neither migrations nor seeds, so tests get registry data from fixtures instead.

  WHY THIS IS AN ERB AGGREGATOR: a single shared calculators.yml was a fan-out
  serialization chokepoint — every parallel frontend build appended its row and
  they collided at merge time (the predicted "fixture<->page coupling", #286),
  defeating the conflict-free-parallel-build promise (CLAUDE.md rule #3: no
  hand-edited central registration).

  So each calculator now owns its OWN fixture file under test/fixtures/calculators/
  (one <slug>.yaml per BUILT calculator, plus _deprecated.yaml for the deprecated-
  scope row). Adding a calculator = adding a file, never editing a shared one —
  exactly rule #3's "add a file" property, now applied to the test fixtures too.

  This file is the only piece Rails' `fixtures :all` loads for the `calculators`
  table: it ERB-inlines every partial below into one fixture set. The partials use
  the .yaml extension (NOT .yml) ON PURPOSE — Rails' fixture glob is `*.{yml}`, so
  a `.yaml` file in a subdirectory is NOT picked up by `fixtures :all` as its own
  (mis-named) fixture set; only this aggregator reads them, loading every row into
  the `calculators` table so the `calculators(:percentage)` accessor keeps working.

  To add a calculator's registry fixture: drop test/fixtures/calculators/<slug>.yaml
  with a single top-level `<slug>:` mapping. Nothing here changes. Names/categories/
  descriptions mirror docs/INVENTORY.md (the registry's source of truth).
-%>
<%= Dir[File.expand_path("calculators/*.yaml", __dir__)].sort.map { |path| File.read(path) }.join("\n") %>
