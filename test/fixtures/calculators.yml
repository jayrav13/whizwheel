# The calculator registry is normally populated by Registry::Ingest from
# docs/INVENTORY.md (via seeds). db:test:prepare runs neither migrations nor seeds,
# so tests get registry data from these fixtures instead.
#
# These cover every BUILT calculator (one row per app/views/calculators/<slug>.html.erb)
# so the registry-driven home catalog (issue #107) renders the full library in tests,
# plus one deprecated row to exercise the .active scope excluding it. Names/categories/
# descriptions mirror docs/INVENTORY.md (the registry's source of truth).
percentage:
  slug: percentage
  name: Percentage Calculator
  category: Math
  complexity: 3
  tags: multi-mode, multi-input
  description: Five percentage operations — % of a number, what percent, percent of what, difference, and increase/decrease.
  source: "[percent-calculator](https://www.calculator.net/percent-calculator.html)"

